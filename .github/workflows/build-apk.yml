name: Build G-K PMS APK

# Runs on every push to main/master (including when you upload the project .zip),
# on version tags (v1.0 ...) and from the Actions tab ("Run workflow").
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Zip upload: if the latest commit added/changed a .zip in the repo root, that zip is
      # unzipped and built (newest upload always wins, even if old project files are in the repo).
      # Otherwise the project files in the repo root are built.
      - name: Find the project (or unzip it)
        run: |
          set -e
          ZIP=$(git show --name-only --diff-filter=AM --pretty=format: HEAD | grep -E '^[^/]+\.zip$' | head -1 || true)
          if [ -z "$ZIP" ] && [ ! -f settings.gradle.kts ]; then
            ZIP=$(ls -t *.zip 2>/dev/null | head -1 || true)
          fi
          if [ -n "$ZIP" ]; then
            echo "Unzipping $ZIP"
            rm -rf _project && mkdir _project
            unzip -q "$ZIP" -d _project
            SETTINGS=$(find _project -name settings.gradle.kts | head -1)
            if [ -z "$SETTINGS" ]; then
              echo "::error::settings.gradle.kts not found inside $ZIP"
              exit 1
            fi
            PROJECT_DIR=$(dirname "$SETTINGS")
          elif [ -f settings.gradle.kts ]; then
            PROJECT_DIR=.
          else
            echo "::error::No project files and no .zip file found in the repository root"
            exit 1
          fi
          echo "Project folder: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/G-K-PMS.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: G-K-PMS-apk
          path: G-K-PMS.apk

      # Download link: Releases page of the repository
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: G-K PMS - build ${{ github.run_number }}
          body: Install G-K-PMS.apk on your Android phone.
          files: G-K-PMS.apk
